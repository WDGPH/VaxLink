version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-maintenance:
        applies-to: version-updates
        patterns: ["*"]
