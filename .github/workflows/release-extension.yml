name: Release VaxLink Extension

on:
  push:
    branches:
      - main
    paths:
      - 'apps/extension/**'
      - '.github/workflows/release-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./apps/extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run extension tests
        if: steps.check.outputs.exists == 'false'
        run: cd apps/extension && npm test

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: |
          cd apps/extension
          zip -r "../../vaxlink-${{ steps.version.outputs.tag }}.zip" . \
            --exclude "tests/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "session-batch-preview.html" \
            --exclude "package.json"

      # Uploads the zip to the Chrome Web Store as a draft.
      # Does NOT submit for review — log into the developer dashboard to publish.
      #
      # Required GitHub secrets:
      #   CHROME_EXTENSION_ID   — last path segment of your Web Store URL
      #   CHROME_CLIENT_ID      — OAuth 2.0 client ID from Google Cloud Console
      #   CHROME_CLIENT_SECRET  — OAuth 2.0 client secret from Google Cloud Console
      #   CHROME_REFRESH_TOKEN  — run `npx chrome-webstore-upload-cli@latest init` once to get this
      - name: Upload to Chrome Web Store (draft)
        if: steps.check.outputs.exists == 'false'
        run: |
          npx chrome-webstore-upload-cli@latest upload \
            --source "vaxlink-${{ steps.version.outputs.tag }}.zip" \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "vaxlink-${{ steps.version.outputs.tag }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VaxLink ${{ steps.version.outputs.tag }}" \
            --generate-notes
