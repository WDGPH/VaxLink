name: Release Please

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: dev

  publish-release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Build channel zips
        run: |
          ./scripts/package-extension.sh alpha
          ./scripts/package-extension.sh prod

      - name: Attach zips to the GitHub Release
        run: gh release upload "$TAG" dist/*.zip --clobber

      - name: Append clinic-feedback table to release notes
        run: |
          set -euo pipefail
          # Issues labeled clinic-feedback closed since the previous release tag.
          prev_tag=$(git tag --sort=-creatordate | grep -v "^$TAG$" | head -1 || true)
          if [ -n "$prev_tag" ]; then
            since=$(git log -1 --format=%cI "$prev_tag")
          else
            since="1970-01-01T00:00:00Z"
          fi
          rows=$(gh issue list --state closed --label clinic-feedback \
            --search "closed:>=$since" \
            --json number,title \
            --template '{{range .}}- #{{.number}} — {{.title}}{{"\n"}}{{end}}')
          if [ -z "$rows" ]; then
            echo "No clinic-feedback issues closed since $prev_tag — skipping."
            exit 0
          fi
          current=$(gh release view "$TAG" --json body --template '{{.body}}')
          printf '%s\n\n## Clinic feedback addressed\n\n%s\n' "$current" "$rows" > notes.md
          gh release edit "$TAG" --notes-file notes.md
