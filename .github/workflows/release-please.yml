name: Release Please

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stable-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please for stable releases
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-stable-assets:
    needs: stable-release
    if: needs.stable-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.stable-release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stable-release.outputs.tag_name }}
          fetch-depth: 0
      - name: Build stable extension package
        run: ./scripts/package-extension.sh prod
      - name: Attach stable package to the GitHub Release
        run: gh release upload "$TAG" dist/vaxlink-prod-*.zip --clobber

  alpha-release:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please for alpha releases
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: dev
          config-file: release-please-dev-config.json
          manifest-file: .release-please-manifest.json

  publish-alpha-assets:
    needs: alpha-release
    if: needs.alpha-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.alpha-release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.alpha-release.outputs.tag_name }}
          fetch-depth: 0
      - name: Build alpha extension package
        run: ./scripts/package-extension.sh alpha
      - name: Attach alpha package to the GitHub Release
        run: gh release upload "$TAG" dist/vaxlink-alpha-*.zip --clobber
