name: Deploy VaxLink site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web-next/**'
      - '.github/workflows/deploy-web-next-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-next

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web-next/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web-next/package-lock.json') }}-${{ hashFiles('apps/web-next/**/*.js', 'apps/web-next/**/*.jsx', 'apps/web-next/**/*.ts', 'apps/web-next/**/*.tsx', 'apps/web-next/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web-next/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          BUILD_STATIC_EXPORT: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || github.event.repository.homepage || format('https://{0}.github.io', github.repository_owner) }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web-next/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
