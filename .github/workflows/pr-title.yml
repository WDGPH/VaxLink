name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test commit-message guard
        run: node --test scripts/check-commit-title.test.js
      - name: Check squash-merge title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-title.js "$PR_TITLE"
