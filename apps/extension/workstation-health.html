<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workstation health - VaxLink</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #202124;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.1rem;
        margin-bottom: 0.25rem;
      }
      p {
        margin-top: 0;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Workstation health</h1>
    <p>
      This check reads the current status. It does not change your scanner or
      chart.
    </p>
    <h2>Scanner</h2>
    <p id="scanner">Checking…</p>
    <h2>Last barcode capture</h2>
    <p id="capture">Checking…</p>
    <h2>National Vaccine Catalogue</h2>
    <p id="nvc">Checking…</p>
    <h2>Selected Panorama tab</h2>
    <p id="chart">Checking…</p>
    <button id="check" type="button">Check again</button>
    <script type="module" src="workstation-health.js"></script>
  </body>
</html>
