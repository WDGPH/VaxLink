<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VaxLink Scanner Setup</title>
    <style>
      :root {
        --bg: #eef5f8;
        --panel: #ffffff;
        --ink: #102135;
        --subtle: #5d6b7a;
        --line: #d4dce6;
        --danger: #b42318;
        --warning: #9a3412;
        --success: #10683e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 720px;
        color: var(--ink);
        background: var(--bg);
        font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      }

      .shell {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
        color: #0b3d4f;
      }

      .lead {
        margin: 6px 0 0;
        max-width: 720px;
        color: var(--subtle);
        line-height: 1.45;
        font-size: 14px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 22px rgba(16, 33, 53, 0.08);
        padding: 14px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        color: #12364a;
      }

      label {
        display: block;
        margin: 0 0 6px;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.2px;
        text-transform: uppercase;
        color: #174d5f;
      }

      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 13px;
        color: #0e2b41;
        background: #fbfdff;
      }

      .actions {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        width: auto;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        background: #0e7490;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #e7f3f4;
        border: 1px solid #bddadd;
        color: #14505f;
      }

      button.warning {
        background: #fff7ed;
        border: 1px solid #f4cda5;
        color: var(--warning);
      }

      button:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }

      .status {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #c8d9e8;
        border-radius: 8px;
        background: #f7fbff;
        color: #1f3d58;
        font-size: 13px;
        line-height: 1.45;
        min-height: 42px;
      }

      .status.success {
        border-color: #b8e3cf;
        background: #eefbf4;
        color: var(--success);
      }

      .status.warning {
        border-color: #f2d3a6;
        background: #fff7ed;
        color: var(--warning);
      }

      .status.error {
        border-color: #efc2c4;
        background: #fff4f4;
        color: var(--danger);
      }

      .embedded body {
        min-width: 0;
        background: transparent;
      }
      .embedded .shell {
        width: 100%;
        margin: 0;
        padding: 0;
        display: flow-root;
      }
      .embedded header,
      .embedded .connection-heading {
        display: none;
      }
      .embedded .card {
        padding: 0;
        border: 0;
        box-shadow: none;
        background: transparent;
      }
      .embedded #connectionStatus {
        margin: 0;
        padding: 0;
        min-height: 0;
        border: 0;
        background: transparent;
      }
      details {
        margin-top: 14px;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
      }
      details[open] > summary {
        margin-bottom: 12px;
      }
      #scannerIdentity {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--subtle);
      }
      .hint {
        margin: 8px 0 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>Scanner Setup</h1>
          <p class="lead">
            Pair your scanner once. Scan capture continues after this view
            closes, including while Windows is locked.
          </p>
        </div>
      </header>

      <section class="card">
        <h2 class="connection-heading">Connection</h2>
        <div id="connectionStatus" class="status" role="status">
          Checking scanner connection…
        </div>
        <p id="scannerIdentity" hidden></p>
        <div class="actions">
          <button id="requestPortBtn">Pair scanner</button>
          <button id="connectGrantedBtn" class="secondary">Reconnect</button>
          <button id="disconnectBtn" class="warning" disabled>
            Disconnect
          </button>
        </div>
        <details>
          <summary>Setup guidance</summary>
          <label for="profileSelect">Scanner profile</label>
          <select id="profileSelect"></select>
          <p id="profileNote" class="hint"></p>
        </details>
        <details id="scannerDiagnostics">
          <summary>Scanner diagnostics</summary>
          <div id="connectionDetails" class="status" role="status"></div>
          <p id="scannerUsbIdentity" class="hint" hidden></p>
          <h2>Scan routing</h2>
          <div id="routeStatus" class="status" role="status">
            No scan result yet.
          </div>
        </details>
      </section>
    </main>

    <script type="module" src="scanner-setup.js"></script>
  </body>
</html>
