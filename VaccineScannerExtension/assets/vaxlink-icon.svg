<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VaxLink Logo</title>
  <desc id="desc">Shield and syringe mark with barcode accents for VaxLink.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4d66"/>
      <stop offset="1" stop-color="#15a39b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.5" y1="0.1" x2="0.5" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff4fb"/>
    </linearGradient>
    <linearGradient id="syringe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b4dc"/>
      <stop offset="1" stop-color="#0b7f98"/>
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#bg)"/>
  <circle cx="398" cy="112" r="74" fill="#ffffff" opacity="0.14"/>
  <circle cx="112" cy="400" r="58" fill="#ffffff" opacity="0.09"/>

  <path
    d="M256 96
       C217 123 176 140 140 152
       V250
       C140 333 191 398 256 426
       C321 398 372 333 372 250
       V152
       C336 140 295 123 256 96Z"
    fill="url(#shield)"
    opacity="0.96"/>

  <g fill="#0c7088">
    <rect x="182" y="244" width="9" height="88" rx="2"/>
    <rect x="198" y="226" width="7" height="106" rx="2"/>
    <rect x="212" y="236" width="11" height="96" rx="2"/>
    <rect x="230" y="220" width="6" height="112" rx="2"/>
    <rect x="242" y="232" width="13" height="100" rx="2"/>
  </g>

  <g transform="translate(260 182) rotate(-36)">
    <rect x="-26" y="46" width="52" height="126" rx="15" fill="url(#syringe)"/>
    <rect x="-34" y="24" width="68" height="32" rx="10" fill="#0c90af"/>
    <rect x="-8" y="6" width="16" height="26" rx="5" fill="#0c90af"/>
    <rect x="-4" y="172" width="8" height="44" rx="4" fill="#0b7a92"/>
    <path d="M0 214 L8 232 L-8 232 Z" fill="#0b7a92"/>
    <rect x="-12" y="83" width="24" height="5" rx="2.5" fill="#dcf7ff"/>
    <rect x="-12" y="103" width="24" height="5" rx="2.5" fill="#dcf7ff"/>
    <rect x="-12" y="123" width="24" height="5" rx="2.5" fill="#dcf7ff"/>
  </g>

  <circle cx="344" cy="174" r="8" fill="#ffffff"/>
  <circle cx="365" cy="154" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
