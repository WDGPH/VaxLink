site_name: VaxLink
site_description: Documentation for the VaxLink Chrome extension
site_url: https://wdgph.github.io/docs/vaxlink/latest/
repo_url: https://github.com/WDGPH/VaxLink
repo_name: WDGPH/VaxLink
copyright: "&copy; Wellington-Dufferin-Guelph Public Health"

# The documentation hub supplies the published theme. Material supports local checks.
theme:
  name: material

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Adding a New EMR: adding-an-emr.md
  - Release Process: RELEASING.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
  - Security Policy: security.md
